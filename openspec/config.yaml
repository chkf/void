schema: spec-driven

context: |
  Language: Simplified Chinese
  All artifacts must be written in Simplified Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  void 是面向个人的 iOS 本地应用运行时。原始计划中暂称 OpenRuntime。Agent 在 Files 中编辑获准访问的项目。
  宿主和新项目的常用界面由真实 SwiftUI 控件绘制，Agent 使用 React/TypeScript 描述页面。
  WKWebView 支持 HTML 应用、Canvas、WebGL 和 WebAssembly。IPA 预编译原生能力，
  通过统一的 Typed RPC 和项目级权限提供服务。每个项目独立管理数据、构建和恢复。
  docs/PROJECT_PLAN.md 保存原始计划。设计中的平台约束或与计划的差异需要给出依据。
  在仓库根目录使用 npm run openspec -- <命令> 调用锁定版本的 CLI。

rules:
  specs:
    - 为原生能力覆盖真实成功路径及适用的授权、签名、系统版本或硬件限制。
  tasks:
    - 区分自动化验证与 iPhone 真机验证，记录缺失条件和实际结果。
