name: iOS 原生构建
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    name: iPhone Release
    runs-on: xcode-27
    concurrency:
      group: ios-${{ github.ref }}-device
      cancel-in-progress: true
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run openspec -- validate --all --strict
      - name: 生成离线工具链并测试 TSX 模板
        run: npm test
      - name: 编译及校验 arm64 安装包
        run: |
          xcodebuild -version
          bash scripts/ios-build.sh device
      - name: 保存未签名的 iPhone 包
        uses: actions/upload-artifact@v4
        with:
          name: void-unsigned-iphone
          path: .build/ios/void-unsigned.ipa
          if-no-files-found: error

  simulator:
    name: iPhone 模拟器测试
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: ios-${{ github.ref }}-test
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
      VOID_SIMULATOR_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - name: 编译模拟器应用与测试
        run: bash scripts/ios-build.sh build-tests
      - name: 启动 iPhone 模拟器
        run: bash scripts/ios-build.sh start-simulator
      - name: 运行原生单元测试与界面测试
        run: bash scripts/ios-build.sh run-tests
      - name: 保存模拟器应用
        uses: actions/upload-artifact@v4
        with:
          name: void-simulator
          path: .build/ios/void-simulator.zip
      - name: 保存 Xcode 测试报告
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for result in .build/ios/*.xcresult; do
            if [[ -d "$result" ]]; then ditto -c -k --keepParent "$result" .build/ios/void-tests.zip; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-tests
          path: .build/ios/void-tests.zip
          if-no-files-found: ignore

  release:
    name: 发布 iPhone 安装包
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.iphone.result == 'success' &&
          (needs.simulator.result == 'success' || contains(github.ref_name, '-dev.')) }}
    needs: [iphone, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: void-unsigned-iphone
          path: release
      - name: 上传已验证的 IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ipa=release/void-unsigned.ipa
          digest="sha256:$(sha256sum "$ipa" | cut -d' ' -f1)"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          simulator_note='同一提交的 iPhone 模拟器测试已通过。'
          if [[ "$SIMULATOR_RESULT" != success ]]; then
            simulator_note='同一提交的模拟器测试尚未全部通过，具体执行结果见下方测试记录。'
          fi
          notes="$RUNNER_TEMP/void-release.md"
          cat > "$notes" <<EOF
          下载下方的 **void-unsigned.ipa**。适用于 iOS 17 及以上的 iPhone，安装前需要使用自己的 Apple 签名。

          本版直接读取项目清单和入口，并分别记录文件选择、授权和扫描结果。请沿用旧版的签名团队和实际 Bundle ID 覆盖安装，从最近项目打开原目录，或在「管理」点「重新扫描并预览」。

          $simulator_note 原 iPhone 上的系统 Open、原「健身记录」预览和训练保存仍待真机验证。

          [SDK 接口与权限](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/SDK_REFERENCE.md) · [真机签名说明](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/BUILD.md)

          SHA-256：${digest#sha256:}

          [原生构建记录与模拟器测试状态](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          if ! gh release view "$tag" --json id >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft "${prerelease[@]}" --title "void $tag" --notes-file "$notes"
          fi
          api=$(gh release view "$tag" --json apiUrl --jq .apiUrl)
          asset_digest() {
            gh api "$api" --jq '.assets[] | select(.name == "void-unsigned.ipa") | .digest'
          }
          if [[ -z "$(asset_digest)" ]]; then gh release upload "$tag" "$ipa"; fi
          [[ "$(asset_digest)" == "$digest" ]]
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$tag" --draft=false
          fi
