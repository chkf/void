name: Native scroll viewport
on: push
permissions:
  contents: read
jobs:
  scroll:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - run: bash scripts/scroll-edge-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-viewport-displays
          path: .build/ios/scroll-displays
