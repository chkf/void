name: Native safe area baseline
on: push
permissions:
  contents: read
jobs:
  native-layout:
    name: 原生导航与外观 (${{ matrix.profile }})
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, phone]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
      VOID_LAYOUT_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - run: bash scripts/ios-build.sh native-layout
      - if: ${{ !cancelled() }}
        run: |
          cd .build/ios
          if [[ -d layout.xcresult ]]; then
            xcrun xcresulttool export attachments --path layout.xcresult --output-path screenshots
            ditto -c -k --keepParent layout.xcresult layout.zip
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-native-ui-${{ matrix.profile }}
          path: |
            .build/ios/layout.zip
            .build/ios/screenshots
          if-no-files-found: ignore
