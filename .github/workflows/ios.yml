name: iOS 原生构建
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    name: iPhone Release
    runs-on: xcode-27
    concurrency:
      group: ios-${{ github.ref }}-device
      cancel-in-progress: true
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run openspec -- validate --all --strict
      - name: 生成离线工具链并测试 TSX 模板
        run: npm test
      - name: 编译及校验 arm64 安装包
        run: |
          xcodebuild -version
          bash scripts/ios-build.sh device
      - name: 保存未签名的 iPhone 包
        uses: actions/upload-artifact@v4
        with:
          name: void-unsigned-iphone
          path: |
            .build/ios/void-unsigned.ipa
            .build/ios/native-ui-example.zip
            .build/ios/safe-area-sample.zip
          if-no-files-found: error

  preview-release:
    name: Release 文件夹导入、权限弹窗与 SQLite 首屏
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - run: bash scripts/ios-build.sh release-preview
      - if: ${{ !cancelled() }}
        run: |
          if [[ -d .build/ios/release-preview.xcresult ]]; then
            xcrun xcresulttool export attachments --path .build/ios/release-preview.xcresult --output-path .build/ios/release-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-release-preview-screenshots
          path: .build/ios/release-screenshots
          if-no-files-found: ignore

  local-picker:
    name: 独立模拟器的本机 Files Open
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - run: bash scripts/ios-build.sh build-tests
      - run: bash scripts/ios-build.sh start-simulator
      - run: bash scripts/ios-build.sh local-picker
      - name: 保存系统选择与首屏结果
        if: ${{ !cancelled() }}
        run: |
          if [[ -d .build/ios/local-picker.xcresult ]]; then
            ditto -c -k --keepParent .build/ios/local-picker.xcresult .build/ios/local-picker.zip
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-local-picker-tests
          path: .build/ios/local-picker.zip
          if-no-files-found: ignore

  simulator:
    name: iPhone 模拟器测试
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: ios-${{ github.ref }}-test
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
      VOID_SIMULATOR_FIXTURES: '1'
      VOID_SEPARATE_LOCAL_PICKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - name: 编译模拟器应用与测试
        run: bash scripts/ios-build.sh build-tests
      - name: 启动 iPhone 模拟器
        run: bash scripts/ios-build.sh start-simulator
      - name: 运行原生单元测试与界面测试
        run: bash scripts/ios-build.sh run-tests
      - name: 保存模拟器应用
        uses: actions/upload-artifact@v4
        with:
          name: void-simulator
          path: .build/ios/void-simulator.zip
      - name: 保存 Xcode 测试报告
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for result in .build/ios/*.xcresult; do
            if [[ -d "$result" ]]; then ditto -c -k --keepParent "$result" .build/ios/void-tests.zip; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-tests
          path: .build/ios/void-tests.zip
          if-no-files-found: ignore

  native-layout:
    name: 原生导航与外观 (${{ matrix.profile }})
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, ipad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VOID_IOS_SDK: '27.2'
      VOID_LAYOUT_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run prepare:ios
      - run: bash scripts/ios-build.sh native-layout
      - if: ${{ !cancelled() }}
        run: |
          cd .build/ios
          if [[ -d layout.xcresult ]]; then
            xcrun xcresulttool export attachments --path layout.xcresult --output-path screenshots
            ditto -c -k --keepParent layout.xcresult layout.zip
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: void-native-ui-${{ matrix.profile }}
          path: |
            .build/ios/layout.zip
            .build/ios/screenshots
          if-no-files-found: ignore

  release:
    name: 发布 iPhone 安装包
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.iphone.result == 'success' && needs.preview-release.result == 'success' && needs.native-layout.result == 'success' &&
          ((needs.simulator.result == 'success' && needs.local-picker.result == 'success') || contains(github.ref_name, '-dev.')) }}
    needs: [iphone, simulator, preview-release, local-picker, native-layout]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: void-unsigned-iphone
          path: release
      - name: 上传已验证的 IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
          LOCAL_PICKER_RESULT: ${{ needs.local-picker.result }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ipa=release/void-unsigned.ipa
          digest="sha256:$(sha256sum "$ipa" | cut -d' ' -f1)"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          simulator_note='同一提交的 iPhone 模拟器测试已通过。'
          if [[ "$SIMULATOR_RESULT" != success || "$LOCAL_PICKER_RESULT" != success ]]; then
            simulator_note='同一提交的模拟器测试尚未全部通过，具体执行结果见下方测试记录。'
          fi
          notes="$RUNNER_TEMP/void-release.md"
          cat > "$notes" <<EOF
          下载下方的 **void-unsigned.ipa**。适用于 iOS / iPadOS 17 及以上设备，安装前需要使用自己的 Apple 签名。

          每次启动 void 都会识别「我的 iPhone → void → 项目名」中的项目清单。在「所有项目」点项目名即可确认启动。长按打开详情，点项目名可同步修改列表名称和「文件」中的文件夹名。

          修复了在系统「文件」点「打开」后可能一直转圈的问题。外部项目会复制到 void 文稿，重启后可继续使用这份副本。已有的本地项目就地打开。

          「创建项目」中可以新建 React 项目，或从公开 GitHub 仓库导入。普通创建完成后可直接打开 OpenMinis 编辑。修复了原目录已有旧登记时可能创建失败的问题。

          在「设置 → 语言」中可切换简体中文和 English。[源码提交](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)

          沿用原签名团队和已安装版本的实际 Bundle ID 覆盖安装，然后从「所有项目」打开原登记。项目可锁定 @runtime/ui 1.1.0 配置系统标签栏和样式，原生 SDK 仍为 1.1.0。

          $simulator_note [原生组件、示例与版本规则](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/NATIVE_UI.md)

          [SDK 接口与权限](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/SDK_REFERENCE.md) · [真机签名说明](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/BUILD.md)

          SHA-256：${digest#sha256:}

          [原生构建记录与模拟器测试状态](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          if ! gh release view "$tag" --json id >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft "${prerelease[@]}" --title "void $tag" --notes-file "$notes"
          fi
          api=$(gh release view "$tag" --json apiUrl --jq .apiUrl)
          for file in "$ipa" release/native-ui-example.zip release/safe-area-sample.zip; do
            name=$(basename "$file")
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            query=".assets[] | select(.name == \"$name\") | .digest"
            if [[ -z "$(gh api "$api" --jq "$query")" ]]; then gh release upload "$tag" "$file"; fi
            [[ "$(gh api "$api" --jq "$query")" == "$expected" ]]
          done
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$tag" --draft=false
          fi
