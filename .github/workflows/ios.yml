name: 核对已测试的构建号 9 并发布
on:
  push:
    branches: [release/verified-v0.1.0-dev.9.1]

permissions:
  contents: read
  actions: read

env:
  GH_REPO: chkf/void
  TAG: v0.1.0-dev.9.1
  TAG_SHA: 32e6f0a4d2cbaca5e996f5debf6f4de14c076d8f
  TEST_SHA: f14e0cf30eec9777923a2bb1ddaec8afe8ee349f
  TAG_RUN: '44456466314'
  TEST_RUN: '44457595930'
  IPA_SHA: 2220a610a7fcc97bf53b3bb926bb4a483eada43df3b44d0dddce36655ffa54a4

jobs:
  verify:
    name: 核对运行结果及每个安装包文件
    runs-on: ubuntu-latest
    steps:
      - name: 验证构建来源与 Xcode 测试结论
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in "$TAG_RUN" "$TEST_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" > "$run.json"
            gh api "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" > "jobs-$run.json"
          done
          python3 - <<'PY'
          import json, os
          e = os.environ
          for role, ref in [('TAG', e['TAG']), ('TEST', 'main')]:
              run = e[role + '_RUN']
              metadata = json.load(open(run + '.json'))
              assert metadata['path'] == '.github/workflows/ios.yml'
              assert metadata['head_repository']['full_name'] == e['GH_REPO']
              assert metadata['event'] == 'push' and metadata['status'] == 'completed'
              assert metadata['head_branch'] == ref and metadata['head_sha'] == e[role + '_SHA']
              jobs = {j['name']: j['conclusion'] for j in json.load(open('jobs-' + run + '.json'))['jobs']}
              required = ['iPhone Release', 'iPhone 模拟器测试']
              if role == 'TEST':
                  required.append('Release 模式下的原目录与 SQLite 首屏')
              for job in required:
                  print(ref, job, jobs.get(job))
                  assert jobs.get(job) == 'success', job
              print(ref, '本机系统 Files', jobs['独立模拟器的本机 Files Open'])
          PY
      - uses: actions/download-artifact@v4
        with:
          repository: chkf/void
          github-token: ${{ github.token }}
          run-id: ${{ env.TAG_RUN }}
          name: void-unsigned-iphone
          path: tagged
      - uses: actions/download-artifact@v4
        with:
          repository: chkf/void
          github-token: ${{ github.token }}
          run-id: ${{ env.TEST_RUN }}
          name: void-unsigned-iphone
          path: tested
      - name: 比较打包内容
        run: |
          set -euo pipefail
          echo "$IPA_SHA  tagged/void-unsigned.ipa" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('tagged/void-unsigned.ipa') as tagged, zipfile.ZipFile('tested/void-unsigned.ipa') as tested:
              names = tagged.namelist()
              assert len(names) == len(set(names)) == len(tested.namelist())
              assert set(names) == set(tested.namelist())
              for name in names:
                  assert tagged.read(name) == tested.read(name), name
              print('已逐项核对', len(names), '项安装包内容')
          PY
  publish:
    name: 发布已核对的标签 IPA
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: chkf/void
          github-token: ${{ github.token }}
          run-id: ${{ env.TAG_RUN }}
          name: void-unsigned-iphone
      - name: 发布开发预览并核对 GitHub 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$IPA_SHA  void-unsigned.ipa" | sha256sum -c -
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          [[ "$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')" == "$TAG_SHA" ]]
          cat > "$RUNNER_TEMP/void-release.md" <<'NOTES'
          下载 **void-unsigned.ipa**，沿用已安装 Void 的签名团队和实际 Bundle ID 覆盖安装。支持 iOS 17 及以上。进入「最近项目 → 健身记录 → 预览项目」即可使用原登记。

          原生首屏连续更新合并为首个和最终状态。宿主确认项目页面已显示在窗口后保存构建。遇到中断时，可在「上次预览诊断」查看对应的请求。已取得此前 dev.9 构建号 9 的用户可继续使用原包，包内各项内容相同。

          标签的 40 项原生测试和 5 项界面测试通过。标签的独立 Release 重建用例有过超时。本次用另一轮通过 9 项 Release、40 项原生和 5 项界面测试的构建复核，将两个 iPhone 安装包逐项比对后发布标签原件。系统 Files 直接选择 App 自身目录的独立用例仍未通过。原 iPhone 的退出原因、原项目首屏及训练保存尚待真机验证。

          [标签测试记录](https://github.com/chkf/void/actions/runs/44456466314) · [通过发布与常规模拟器测试的运行](https://github.com/chkf/void/actions/runs/44457595930) · [原位更新说明](https://github.com/chkf/void/blob/main/docs/BUILD.md) · [详细验证结果](https://github.com/chkf/void/blob/main/docs/LIMITATIONS.md)
          NOTES
          echo >> "$RUNNER_TEMP/void-release.md"
          echo "SHA-256 \`$IPA_SHA\`" >> "$RUNNER_TEMP/void-release.md"
          if ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --prerelease --title "void $TAG · 构建号 9" --notes-file "$RUNNER_TEMP/void-release.md"
          fi
          api=$(gh release view "$TAG" --json apiUrl --jq '.apiUrl')
          digest() { gh api "$api" --jq '.assets[] | select(.name == "void-unsigned.ipa") | .digest'; }
          if [[ -z "$(digest)" ]]; then gh release upload "$TAG" void-unsigned.ipa; fi
          [[ "$(digest)" == "sha256:$IPA_SHA" ]]
          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]]; then gh release edit "$TAG" --draft=false; fi
